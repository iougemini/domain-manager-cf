<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="DSMC">
  <title>DSMC — Domain Status Manager for Cloudflare</title>
  <!-- 与站点 favicon（src/ui/favicon.js 的 SHIELD_SVG）同一枚图形：
       蓝色渐变圆角方块 + 白色盾牌与对勾。改动时两处要同步。 -->
  <defs>
    <linearGradient id="dsmc-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5F9BFF"/>
      <stop offset="1" stop-color="#2F6BE8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#dsmc-bg)"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 13.5l13.6 5.9v9.9c0 8.7-5.7 15.6-13.6 19.5-7.9-3.9-13.6-10.8-13.6-19.5v-9.9L32 13.5z"/>
    <path d="M25.4 31.6l4.9 4.9 8.8-8.8"/>
  </g>
</svg>
